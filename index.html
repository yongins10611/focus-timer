<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집중관리 타이머</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:#fff;
  font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
  background:linear-gradient(135deg,#10131a,#202733);
}
.container { width:min(1050px,94%); margin:auto; padding:35px 0; }
h1 { text-align:center; margin:0; font-size:36px; }
.subtitle { text-align:center; color:#aeb7c5; margin:10px 0 28px; }
.layout { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.card {
  background:#191e27; border:1px solid #303846; border-radius:22px;
  padding:24px; box-shadow:0 15px 40px rgba(0,0,0,.28);
}
.setting-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
label { display:block; color:#aeb7c5; font-size:14px; margin-bottom:7px; }
input {
  width:100%; padding:12px; border-radius:10px; border:1px solid #3a4351;
  background:#0f1217; color:#fff; font-size:17px;
}
.timer {
  text-align:center; font-size:82px; font-weight:800;
  font-variant-numeric:tabular-nums; margin:25px 0 12px;
}
.status {
  text-align:center; font-size:21px; font-weight:800; margin-bottom:20px;
}
.status.focus { color:#86efac; }
.status.distract { color:#fb7185; }
.status.idle { color:#aeb7c5; }
.buttons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
button {
  border:0; border-radius:11px; padding:12px 20px; font-size:16px;
  font-weight:800; cursor:pointer; background:#343c49; color:#fff;
}
button.start { background:#f1f5f9; color:#10131a; }
button:disabled { opacity:.4; cursor:not-allowed; }
.progress-title { display:flex; justify-content:space-between; color:#aeb7c5; margin-top:22px; font-size:14px; }
.progress { height:9px; background:#303846; border-radius:20px; margin-top:8px; overflow:hidden; }
.progress-bar { height:100%; width:0; background:#dbeafe; transition:width .3s; }
.feedback { text-align:center; }
.feedback img {
  width:100%; height:440px; object-fit:contain; border-radius:16px;
  background:#090b0f;
}
.message { font-size:29px; font-weight:900; margin:17px 0 8px; min-height:42px; }
.explain { color:#aeb7c5; line-height:1.6; min-height:52px; }
.log {
  border-top:1px solid #303846; margin-top:18px; padding-top:10px;
  max-height:145px; overflow:auto; text-align:left;
}
.log div { color:#cbd5e1; font-size:13px; padding:4px 0; }
.notice {
  margin-top:20px; padding:13px 15px; border-radius:12px;
  background:#11151c; color:#aeb7c5; font-size:13px; line-height:1.6;
}
@media(max-width:760px) {
  .layout { grid-template-columns:1fr; }
  .timer { font-size:62px; }
  .feedback img { height:360px; }
}

/* ===== 휴대폰 최적화 ===== */
html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
}

button, input {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

button {
    min-height: 46px;
}



@media (max-width: 380px) {
    .settings {
        grid-template-columns: 1fr;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .feedback img {
        height: 58vh;
        min-height: 250px;
    }
}

</style>
</head>

<body>
<div class="container">
  <h1>🔥 집중관리 타이머</h1>
  <div class="subtitle">집중하면 칭찬 · 이탈하거나 일시정지하면 피드백</div>

  <div class="layout">
    <div class="card">
      <div class="setting-grid">
        <div>
          <label>집중 시간 (분)</label>
          <input id="minutes" type="number" min="1" max="240" value="25">
        </div>
        <div>
          <label>사진/메시지 변경 (초)</label>
          <input id="changeSeconds" type="number" min="3" max="300" value="10">
        </div>
      </div>

      <div id="timer" class="timer">25:00</div>
      <div id="status" class="status idle">● 대기 중</div>

      <div class="buttons">
        <button id="start" class="start">▶ 시작</button>
        <button id="pause" disabled>Ⅱ 일시정지</button>
        <button id="reset">↻ 초기화</button>
      </div>

      <div class="progress-title">
        <span>진행률</span><span id="percent">0%</span>
      </div>
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>

      <div class="log" id="log"></div>

      <div class="notice">
        <b>상태 판정 기준</b><br>
        타이머 실행 중 이 페이지를 보고 있으면 집중 상태입니다.
        다른 탭/창으로 이동하거나 브라우저가 백그라운드가 되면 딴짓 상태로 바뀝니다.
        일시정지도 딴짓 상태로 처리합니다.
      </div>
    </div>

    <div class="card feedback">
      <img id="feedbackImage" alt="상태 이미지">
      <div id="message" class="message">타이머를 시작해보자.</div>
      <div id="explain" class="explain">시작하면 현재 상태에 맞는 사진과 메시지가 나타납니다.</div>
    </div>
  </div>
</div>

function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function fillTime(text, minutes) {
    return text.replaceAll("{m}", minutes);
}

function rememberMessage(message) {
    messageHistory.push(message);
    if (messageHistory.length > MAX_HISTORY) messageHistory.shift();
    return message;
}

function uniqueMessage(generator) {
    /*
       최근 300개와 겹치지 않는 문장을 찾습니다.
       조합 공간이 매우 커서 일반적인 사용에서는 항상 새로운 문장이 나옵니다.
    */
    for (let i = 0; i < 100; i++) {
        const message = generator();
        if (!messageHistory.includes(message)) {
            return rememberMessage(message);
        }
    }

    // 혹시라도 반복될 경우 마지막에 작은 변형을 붙입니다.
    const fallback = generator() + " 계속!";
    return rememberMessage(fallback);
}

function generatePraiseMessage() {
    const elapsed = totalSeconds - remaining;
    const minutes = Math.max(1, Math.floor(elapsed / 60));

    return uniqueMessage(() => {
        const mode = Math.floor(Math.random() * 5);

        if (mode === 0 && minutes >= 1) {
            return `${fillTime(pick(praiseBoosters), minutes)} ${pick(praiseActions)}. ${pick(praiseEndings)}`;
        }

        if (mode === 1) {
            return `${pick(praiseOpeners)}! ${pick(praiseDetails)} ${pick(praiseActions)}.`;
        }

        if (mode === 2) {
            return `${pick(praiseOpeners)}, ${pick(praiseActions)}! ${pick(praiseEndings)}`;
        }

        if (mode === 3) {
            return `${pick(praiseDetails)} ${pick(praiseActions)}. ${pick(praiseEndings)}`;
        }

        return `${pick(praiseOpeners)}! ${fillTime(pick(praiseBoosters), minutes)} ${pick(praiseEndings)}`;
    });
}

function generateCriticismMessage() {
    const elapsed = totalSeconds - remaining;
    const minutes = Math.max(1, Math.floor(elapsed / 60));

    return uniqueMessage(() => {
        const mode = Math.floor(Math.random() * 5);

        if (mode === 0) {
            return `${pick(distractOpeners)}, ${pick(distractActions)}. ${pick(distractEndings)}`;
        }

        if (mode === 1) {
            return `${pick(distractDetails)}. ${pick(distractActions)}! ${pick(distractEndings)}`;
        }

        if (mode === 2) {
            return `${pick(distractOpeners)}! ${pick(distractDetails)}. ${pick(distractEndings)}`;
        }

        if (mode === 3 && minutes >= 1) {
            return `${minutes}분이나 지났는데 ${pick(distractActions)}. ${pick(distractEndings)}`;
        }

        return `${pick(distractOpeners)}, ${pick(distractDetails)}. ${pick(distractEndings)}`;
    });
}

function randomDifferent(arr, previous) {
  if (arr.length < 2) return arr[0];
  let value;
  do {
    value = arr[Math.floor(Math.random() * arr.length)];
  } while(value === previous);
  return value;
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function getState() {
  if (!running) return "idle";
  if (paused || document.hidden || !document.hasFocus()) return "distract";
  return "focus";
}

function setFeedback(state, forceImage=true) {
  if (state === "focus") {
    if (forceImage) {
      lastImage = randomDifferent(praiseImages, lastImage);
      $("feedbackImage").src = lastImage;
    }
    lastMessage = generatePraiseMessage();
    $("message").textContent = lastMessage;
    $("explain").textContent = "좋아! 지금 흐름 그대로 계속 집중해보자.";
  } else if (state === "distract") {
    if (forceImage) {
      lastImage = randomDifferent(criticismImages, lastImage);
      $("feedbackImage").src = lastImage;
    }
    lastMessage = generateCriticismMessage();
    $("message").textContent = lastMessage;
    $("explain").textContent = "현재 딴짓 상태입니다. 다시 이 페이지로 돌아오면 집중 상태로 전환됩니다.";
  } else {
    $("message").textContent = "타이머를 시작해보자.";
    $("explain").textContent = "시작하면 현재 상태에 맞는 사진과 메시지가 나타납니다.";
  }
}

function addLog(state) {
  if (state === "idle") return;
  const time = new Date().toLocaleTimeString("ko-KR");
  const text = state === "focus" ? "집중 상태" : "딴짓 상태";
  const row = document.createElement("div");
  row.textContent = "[" + time + "] " + text;
  $("log").prepend(row);
}

function updateState(force=false) {
  const state = getState();
  if (!force && state === lastState) return;

  lastState = state;
  $("status").className = "status " + state;

  if (state === "focus") {
    $("status").textContent = "● 집중 상태";
  } else if (state === "distract") {
    $("status").textContent = "● 딴짓 상태";
  } else {
    $("status").textContent = "● 대기 중";
  }

  setFeedback(state, true);
  addLog(state);
}

function render() {
  $("timer").textContent = formatTime(remaining);
  const progress = totalSeconds === 0
    ? 0
    : Math.min(100, Math.max(0, ((totalSeconds - remaining) / totalSeconds) * 100));
  $("progressBar").style.width = progress + "%";
  $("percent").textContent = Math.round(progress) + "%";
}

function startTimer() {
  if (running) return;

  const minutes = Math.min(240, Math.max(1, Number($("minutes").value) || 25));

  if (remaining <= 0) {
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
  }

  running = true;
  paused = false;

  $("start").disabled = true;
  $("pause").disabled = false;
  $("pause").textContent = "Ⅱ 일시정지";

  updateState(true);
  render();

  timerInterval = setInterval(() => {
    if (!running || paused) return;

    remaining--;
    render();

    if (remaining <= 0) {
      finishTimer();
    }
  }, 1000);

  startChangeTimer();
}

function startChangeTimer() {
  clearInterval(changeInterval);

  const seconds = Math.min(300, Math.max(3, Number($("changeSeconds").value) || 10));

  changeInterval = setInterval(() => {
    if (!running) return;

    const state = getState();
    if (state === "focus" || state === "distract") {
      setFeedback(state, true);
    }
  }, seconds * 1000);
}

function togglePause() {
  if (!running) return;

  paused = !paused;

  $("pause").textContent = paused ? "▶ 계속하기" : "Ⅱ 일시정지";
  updateState(true);
}

function finishTimer() {
  running = false;
  paused = false;

  clearInterval(timerInterval);
  clearInterval(changeInterval);

  remaining = 0;
  render();

  $("start").disabled = false;
  $("pause").disabled = true;
  $("pause").textContent = "Ⅱ 일시정지";

  lastState = "focus";
  $("status").className = "status focus";
  $("status").textContent = "● 완료!";
  $("message").textContent = "완주했다! 잘했어!";
  $("explain").textContent = "설정한 집중 시간이 끝났습니다.";
}

function resetTimer() {
  running = false;
  paused = false;

  clearInterval(timerInterval);
  clearInterval(changeInterval);

  const minutes = Math.min(240, Math.max(1, Number($("minutes").value) || 25));
  totalSeconds = minutes * 60;
  remaining = totalSeconds;

  $("start").disabled = false;
  $("pause").disabled = true;
  $("pause").textContent = "Ⅱ 일시정지";

  $("log").innerHTML = "";
  lastImage = "";
  lastMessage = "";
  lastState = "idle";

  render();
  updateState(true);
}

$("start").addEventListener("click", startTimer);
$("pause").addEventListener("click", togglePause);
$("reset").addEventListener("click", resetTimer);

$("minutes").addEventListener("change", () => {
  if (!running) {
    const minutes = Math.min(240, Math.max(1, Number($("minutes").value) || 25));
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    render();
  }
});

$("changeSeconds").addEventListener("change", () => {
  if (running) startChangeTimer();
});

/* 탭을 떠남 / 돌아옴 감지 */
document.addEventListener("visibilitychange", () => {
  if (running) updateState(true);
});

window.addEventListener("blur", () => {
  if (running) updateState(true);
});

window.addEventListener("focus", () => {
  if (running) updateState(true);
});

render();
updateState(true);
</script>
</body>
</html>
